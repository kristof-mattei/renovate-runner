name: Trigger Renovate

on:
  schedule:
    # Renovate's `schedule` (America/Phoenix, UTC-7 without DST) in UTC
    - cron: "5-59/15 0-14 * * 1-5"
    - cron: "5-59/15 * * * 0,6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger-renovate:
    name: Trigger Renovate (${{ matrix.owner }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        owner:
          - kristof-mattei
          - actions-rs-plus

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Tick the Dependency Dashboard checkboxes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_TO_TRIGGER_SUBSEQUENT_WORKFLOWS }}
          OWNER: ${{ matrix.owner }}
        run: |
          ./.github/scripts/trigger-renovate-issue.sh --owner "${OWNER}"
